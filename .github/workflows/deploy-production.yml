name: Deploy production

# The rollback button: deploys a commit that is already green to production on
# the mychess VM. Every push to main deploys itself once its gate and E2E pass
# (ci.yml, R-213); this is for going back to an earlier release, for
# redeploying a commit whose run went green on a re-run, or for redeploying
# main's head after a host setting changed (infra/host/set-secret.sh). Run it
# from the Actions tab (Run workflow) on main; the commit is main's head
# unless a full SHA is typed (an earlier green release). Its image must still
# be on the VM, which keeps the last three releases
# (infra/ci/release-image.sh). The next push to main deploys over it.
#
# Three jobs. `verify` (GitHub-hosted) refuses a commit that is not in main's
# history or whose latest CI/CD run did not pass every job but deploy.
# `deploy` runs on the VM's self-hosted runner (label `production`) and calls
# infra/ci/deploy-production.sh, which takes a restore-point dump first,
# migrates, replaces web, verifies the release and puts the previous web back
# if that fails. `live` (GitHub-hosted) asks the public site, the repository
# variable PRODUCTION_URL, which commit it serves (skipped while it is unset).
#
# It never runs on a pull request or a push, only on this button.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA to deploy (empty is main's head). It needs a green CI/CD run.
        required: false

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'tomyka/mychess' && github.ref == 'refs/heads/main' && vars.PRODUCTION_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      TYPED: ${{ inputs.sha }}
    steps:
      - name: The commit to deploy
        id: pick
        run: |
          sha="${TYPED:-$GITHUB_SHA}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::not a full commit SHA: $sha"; exit 1; }
          status="$(gh api "repos/$REPO/compare/main...$sha" --jq .status)"
          case "$status" in
            identical|behind) ;;
            *) echo "::error::$sha is not in main's history ($status)"; exit 1 ;;
          esac
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      # Green: every job of its latest finished CI/CD run passed, the deploy
      # job aside, so a commit whose own deploy failed on the host (a setting
      # since fixed) can still be redeployed from here.
      - name: Its CI/CD run passed the gate, the image and E2E
        env:
          SHA: ${{ steps.pick.outputs.sha }}
        run: |
          run="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&status=completed" --jq '.workflow_runs[0].id // empty')"
          [ -n "$run" ] || { echo "::error::no finished CI/CD run for $SHA"; exit 1; }
          results="$(gh api "repos/$REPO/actions/runs/$run/jobs" --paginate --jq '.jobs[] | select(.name != "deploy") | .conclusion')"
          if [ -z "$results" ] || grep -qvx success <<< "$results"; then
            echo "::error::run $run for $SHA has a job that did not pass"
            exit 1
          fi
          echo "$SHA is green: run $run"

  deploy:
    needs: verify
    runs-on: [self-hosted, production]
    timeout-minutes: 20
    permissions:
      contents: read
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      SHA: ${{ needs.verify.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.sha }}
          sparse-checkout: infra
          persist-credentials: false
      - name: Deploy
        run: sudo -n "$GITHUB_WORKSPACE/infra/ci/deploy-production.sh" "$SHA-arm64"

  live:
    needs: [verify, deploy]
    if: vars.PRODUCTION_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SHA: ${{ needs.verify.outputs.sha }}
      SITE: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: The public site serves that commit
        run: |
          for _ in 1 2 3 4 5 6; do
            body="$(curl -fsS --max-time 10 "$SITE/api/version" || true)"
            [ "$body" = "{\"commit\":\"$SHA\"}" ] && { echo "$SITE serves $SHA"; exit 0; }
            sleep 10
          done
          echo "::error::$SITE answered '$body', expected commit $SHA"
          exit 1
