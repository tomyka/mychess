name: CI/CD

on:
  push:
    branches: [main, phase-b]
  pull_request:
    branches: [main, phase-b]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mychess
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mychess/package-lock.json
      # Before `npm ci`, so a collision fails in seconds rather than after a
      # full install (GitHub issue #194). `supabase db push` keys on the version
      # parsed from the filename, so two files sharing one version leave one of
      # each pair permanently unmatched against
      # `supabase_migrations.schema_migrations` — and it then refuses to push
      # ANYTHING, with a message that names no files at all (#156). This repo
      # paid that diagnosis cost four times (0013, 0062, 0074, and the one
      # 0063's own "NOTE ON NUMBERING" records) before anything checked it.
      #
      # Duplicates only. Gaplessness is deliberately NOT asserted: `main` has a
      # real gap at 0074 from a renumber, and monotonicity is vacuous for a
      # sorted listing.
      - name: Check migration versions are unique
        run: |
          duplicates=$(ls supabase/migrations | sed 's/_.*//' | sort | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "::error::Two or more migrations share a version number."
            echo ""
            echo "Colliding files:"
            for version in $duplicates; do
              echo "  version $version:"
              ls supabase/migrations | grep "^${version}_" | sed 's/^/    /'
            done
            echo ""
            echo "Fix: renumber the NEWER file to the next free version, and add a"
            echo "note in it recording the renumber - 0063, 0076 and 0077 each do."
            exit 1
          fi
          echo "No duplicate migration versions."
      - run: npm ci
      - run: npm test
      # Gated as of #91, when 10 accumulated lint errors (three of them a
      # parser misconfiguration that silently skipped every `.svelte.ts`
      # module) went unnoticed precisely because nothing ran this. Errors
      # only — the 164 `no-explicit-any`-style warnings don't fail the job.
      - run: npm run lint

  deploy:
    name: Deploy to Vercel
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    defaults:
      run:
        working-directory: mychess
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mychess/package-lock.json

      - name: Check required secrets
        run: |
          missing=""
          [ -z "${{ secrets.VERCEL_TOKEN }}" ] && missing="$missing VERCEL_TOKEN"
          [ -z "${{ secrets.PUBLIC_SUPABASE_URL }}" ] && missing="$missing PUBLIC_SUPABASE_URL"
          [ -z "${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}" ] && missing="$missing PUBLIC_SUPABASE_ANON_KEY"
          [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ] && missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          if [ -n "$missing" ]; then
            echo "❌ Missing GitHub secrets:$missing"
            echo "Add them at: https://github.com/tomyka/mychess/settings/secrets/actions"
            exit 1
          fi
          echo "✅ All secrets present"

      - run: npm ci

      - name: Write .env for build
        run: |
          echo "PUBLIC_SUPABASE_URL=${{ secrets.PUBLIC_SUPABASE_URL }}" > .env
          echo "PUBLIC_SUPABASE_ANON_KEY=${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}" >> .env
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env

      - run: npm install -g vercel@latest

      - name: Deploy preview (phase-b)
        if: github.ref == 'refs/heads/phase-b'
        # Run from the checkout root: the Vercel project's Root Directory is
        # already "mychess", so running from the app dir would double it.
        working-directory: ${{ github.workspace }}
        run: |
          URL=$(vercel deploy --token=${{ secrets.VERCEL_TOKEN }} \
            --env PUBLIC_SUPABASE_URL=${{ secrets.PUBLIC_SUPABASE_URL }} \
            --env PUBLIC_SUPABASE_ANON_KEY=${{ secrets.PUBLIC_SUPABASE_ANON_KEY }} \
            --env SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }})
          echo "✅ Preview deployed: $URL"
          echo "DEPLOY_URL=$URL" >> $GITHUB_ENV

      - name: Deploy production (main)
        if: github.ref == 'refs/heads/main'
        # Run from the checkout root: the Vercel project's Root Directory is
        # already "mychess", so running from the app dir would double it.
        working-directory: ${{ github.workspace }}
        run: |
          vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} \
            --env PUBLIC_SUPABASE_URL=${{ secrets.PUBLIC_SUPABASE_URL }} \
            --env PUBLIC_SUPABASE_ANON_KEY=${{ secrets.PUBLIC_SUPABASE_ANON_KEY }} \
            --env SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
