name: CI/CD

# Build once, test the image, deploy what passed (ADR 0010, R-164, R-165,
# R-213). One push runs this graph:
#
#   static ----------+
#   test (4 shards) -+--> check --+
#   image --> e2e (4 parts) ------+--> deploy (main only)
#
# static, test and check are the quality gate, split so it finishes sooner
# (R-212): static runs the gates that need no test results, test runs the
# vitest suite in parallel shards that keep their results and coverage, and
# check passes only when static and every shard passed and the merged results
# meet the coverage thresholds and CRAP. image builds the one app image
# natively on a GitHub-hosted arm64 runner, scans it with Trivy, and saves it
# as a zstd archive, uploaded as a short-lived artifact with its sha256 as a
# job output. e2e loads that archive and runs the Playwright suite against a
# throwaway stack made from it (infra/ci/e2e-stack.sh), so the black-box tests
# run on the very bytes that deploy.
#
# On main, once check and e2e have passed, `deploy` runs on the production
# VM's own runner (label `production`), downloads the same archive and calls
# infra/ci/deploy-production.sh --if-newer: restore point, migrate, swap,
# release check through Caddy, the previous web put back if that fails, and
# nothing done when production already runs this commit or a newer one (runs
# of two pushes can finish out of order). A red gate or E2E deploys nothing;
# there is no deploy on trial and no automatic rollback (R-213, retiring
# R-192). deploy-production.yml is the button for a rollback to an earlier
# green commit. There is no staging environment (R-166). A push of another
# branch runs the graph up to e2e and stops.
#
# Every job but deploy runs on GitHub's hosted runners (R-165: the repository
# is public, so their minutes are free). This workflow has no pull_request
# trigger, so only a push to this repository or a dispatch can start a
# production job, and that job also requires main. The VM's runner refuses
# every other job itself (infra/host/runner-job-started.sh, #353: only this
# repository's main ci.yml and deploy-production.yml, on push or dispatch).
# The dispatch is how dependabot-automerge.yml has main tested and deployed
# after it merges (its merge, made with GITHUB_TOKEN, starts no push run), and
# how the owner re-runs main by hand. Dependabot's branches are pushes here,
# so their pull requests are tested too.
#
# Concurrency: elsewhere a newer push cancels the superseded run, which only
# tests stale code; on main each run is its own group, so no run is cut off
# mid-deploy. The deploy job's own group queues deploys one at a time, and a
# newer run's deploy replaces an older one still waiting for its turn.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  # The app image's name (infra/ci/release-image.sh's RELEASE_IMAGE).
  RELEASE_IMAGE: mychess

jobs:
  # The gates that need no test results: format, lint, typecheck, markers,
  # dead code, architecture; and the secret scan and the kit's and the
  # infrastructure scripts' own tests.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The secret scan reads the whole history.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Security checklist item 10 (#233): no secret in any commit.
      - name: Secret scan
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" zricethezav/gitleaks:v8.28.0 git /repo --no-banner --redact
      - name: The kit's own tests
        run: node --test "quality/*.test.mjs"
      # The deploy and host scripts' shell tests (stubs only: no host, image or
      # database is touched); shellcheck is on the runner, so they lint too.
      - name: Infrastructure scripts' tests
        run: for test in infra/*/tests/*-test.sh; do bash "$test" || exit 1; done
      - name: Quality gate, the gates that run no tests
        run: node quality/gate.mjs check --static

  # The vitest suite with coverage in parallel shards (vitest --shard), each
  # with its own Testcontainers databases. A shard applies no coverage
  # threshold (its coverage is partial); it keeps its results and coverage as
  # a blob report for check.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Quality gate, this shard's tests
        env:
          # The total must match the matrix above.
          SHARD: ${{ matrix.shard }}/4
        run: node quality/gate.mjs test-shard "$SHARD"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-shard-${{ matrix.shard }}
          retention-days: 1
          path: reports/test-shards/
          if-no-files-found: error

  # The gate's verdict, which deploy reads: static and every test shard
  # passed, and the shards' merged results pass the test gate (no failed
  # test, every test file run by a project, the coverage thresholds) and
  # CRAP. It runs after a failure too, so it ends red rather than skipped.
  check:
    needs: [static, test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Static and every test shard passed
        env:
          STATIC: ${{ needs.static.result }}
          TEST: ${{ needs.test.result }}
        run: |
          [ "$STATIC" = success ] && [ "$TEST" = success ] \
            || { echo "::error::static $STATIC, test shards $TEST"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-shard-*
          merge-multiple: true
          path: reports/test-shards
      - name: Quality gate, the shards merged (tests, coverage, CRAP)
        run: node quality/gate.mjs test-merge
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: quality-reports
          retention-days: 3
          path: |
            coverage/
            reports/
          if-no-files-found: ignore

  # The one build, as mychess:<sha>-arm64 (the VM is arm64).
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    outputs:
      sha256: ${{ steps.save.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build
        run: |
          docker build --build-arg APP_COMMIT="$GITHUB_SHA" \
            -t "$RELEASE_IMAGE:$GITHUB_SHA-arm64" .
      # Scan before anything is deployed: a fixable CRITICAL vulnerability stops
      # the release. --ignore-unfixed keeps a base-image CVE with no fix from
      # blocking deploys; a known false positive is allowed only by an entry
      # (with a reason comment) in .trivyignore. HIGH findings are listed in
      # the job summary and never fail the job. Trivy runs as a container,
      # pinned by digest, and scans the image in the runner's Docker.
      - name: Trivy scan (CRITICAL fails the job, HIGH is listed)
        env:
          TRIVY_IMAGE: aquasec/trivy@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e # 0.70.0
        run: |
          trivy() {
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v trivy-cache:/root/.cache \
              -v "$PWD/.trivyignore:/trivyignore:ro" \
              "$TRIVY_IMAGE" image --scanners vuln --ignore-unfixed \
              --ignorefile /trivyignore --format table "$@"
          }
          ref="$RELEASE_IMAGE:$GITHUB_SHA-arm64"
          trivy --severity HIGH "$ref" > trivy-high.txt || true
          trivy --severity CRITICAL --exit-code 1 "$ref"
      - name: List HIGH findings in the job summary and the log
        if: always()
        run: |
          {
            echo "## Trivy: fixable HIGH vulnerabilities (CRITICAL ones fail the job)"
            echo '```'
            cat trivy-high.txt 2>/dev/null || echo "(no report)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # The archive's checksum goes to e2e and deploy, which refuse any other
      # bytes (release-image.sh says why a checksum and not the image id).
      - name: Save the image
        id: save
        run: |
          docker save "$RELEASE_IMAGE:$GITHUB_SHA-arm64" | zstd -q -T0 -o image.tar.zst
          echo "sha256=$(sha256sum image.tar.zst | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: image
          path: image.tar.zst
          retention-days: 3
          # Already compressed.
          compression-level: 0
          if-no-files-found: error

  # Browser tests against a throwaway stack made from the image just built,
  # in parallel parts: each loads the same image and starts its own stack, so
  # the parts share no database or inbox. Desktop runs every journey, the
  # phone profile only those tagged @mobile (playwright.config.ts, R-213).
  # Playwright's --shard splits by test count, and the training journeys are
  # few but slow, so the desktop parts are cut by spec file instead: the
  # slowest file, then the next slowest three, then `rest`, every desktop
  # test the first two leave (a new spec always runs). Each part's "E2E" step
  # time is in the run; when one grows well past the others, move a file
  # between DESKTOP_1 and DESKTOP_2. fail-fast is off, so one failing part
  # does not cancel the others' results.
  e2e:
    needs: image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: [desktop-1, desktop-2, desktop-rest, mobile]
    env:
      APP_IMAGE: mychess:${{ github.sha }}-arm64
      PROJECT: mychess-e2e-${{ github.run_id }}-${{ matrix.part }}
      IMAGE_SHA256: ${{ needs.image.outputs.sha256 }}
      # Playwright --grep patterns over the spec file names (see above).
      DESKTOP_1: training-learn\.spec
      DESKTOP_2: (training-review|training-arrows|repertoires)\.spec
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}/image
      - name: Load the image (the build's bytes only)
        run: |
          archive="$RUNNER_TEMP/image/image.tar.zst"
          echo "$IMAGE_SHA256  $archive" | sha256sum -c -
          zstd -dc "$archive" | docker load
          docker image inspect "$APP_IMAGE" > /dev/null
      # client-bundle.spec.ts reads the client chunks from apps/web/.next/static:
      # the image's own, so it checks the bytes that deploy.
      - name: The image's client chunks for the bundle test
        run: |
          container="$(docker create "$APP_IMAGE")"
          mkdir -p apps/web/.next
          docker cp "$container:/app/apps/web/.next/static" apps/web/.next/static
          docker rm "$container" > /dev/null
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm --filter @mychess/web exec playwright install --with-deps --only-shell chromium
      - name: Start the stack from this commit's image
        # Separate assignments, so a failing command fails this step (a command
        # substitution inside echo's argument would hide it).
        run: |
          url="$(infra/ci/e2e-stack.sh up "$PROJECT")"
          mailpit="$(infra/ci/e2e-stack.sh mailpit "$PROJECT")"
          database="$(infra/ci/e2e-stack.sh database "$PROJECT")"
          {
            echo "E2E_BASE_URL=$url"
            echo "MAILPIT_URL=$mailpit"
            echo "DATABASE_URL=$database"
          } >> "$GITHUB_ENV"
      # With E2E_BASE_URL set, playwright.config.ts starts no server of its own.
      - name: E2E, this part's tests
        working-directory: apps/web
        env:
          PART: ${{ matrix.part }}
        run: |
          case "$PART" in
            desktop-1) selection=(--project=desktop-chromium "--grep=$DESKTOP_1") ;;
            desktop-2) selection=(--project=desktop-chromium "--grep=$DESKTOP_2") ;;
            desktop-rest) selection=(--project=desktop-chromium "--grep-invert=$DESKTOP_1|$DESKTOP_2") ;;
            mobile) selection=(--project=pixel-7) ;;
            *) echo "::error::unknown part $PART"; exit 1 ;;
          esac
          pnpm exec playwright test --list "${selection[@]}" | tail -n 1
          pnpm exec playwright test "${selection[@]}"
      - name: The web's log
        if: failure()
        run: docker compose -p "$PROJECT" logs --tail 200 web || true
      - name: Stop the stack
        if: always()
        run: infra/ci/e2e-stack.sh down "$PROJECT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: e2e-report-${{ matrix.part }}
          retention-days: 3
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore

  # The tested image to production, on the VM's own runner, once the gate
  # and every E2E part passed (R-213): restore point, migrate, swap, release
  # check through the edge, the previous web put back on a failure; nothing
  # done when production already runs this commit or a newer one
  # (--if-newer). The site's name comes from the host's own settings
  # (BETTER_AUTH_URL); the environment's link is the repository variable
  # PRODUCTION_URL. Until that variable is set (the VM is not ready) the job
  # is skipped rather than left queued with no runner to take it.
  deploy:
    needs: [check, image, e2e]
    if: github.ref == 'refs/heads/main' && github.repository == 'tomyka/mychess' && vars.PRODUCTION_URL != ''
    runs-on: [self-hosted, production]
    timeout-minutes: 20
    concurrency:
      group: production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      # main's history too: whether production already runs a newer commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: infra
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}/image
      - name: Deploy
        env:
          IMAGE_SHA256: ${{ needs.image.outputs.sha256 }}
        run: |
          sudo -n "$GITHUB_WORKSPACE/infra/ci/deploy-production.sh" --if-newer "$GITHUB_SHA-arm64" "$RUNNER_TEMP/image/image.tar.zst" "$IMAGE_SHA256"
      # The archive is in the image store now; the runner's disk is the VM's.
      - name: Remove the downloaded archive
        if: always()
        run: rm -rf "$RUNNER_TEMP/image"
