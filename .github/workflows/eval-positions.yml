name: Evaluate new positions

# Keeps `positions.eval_cp` current so the eval bar has a number without any
# client downloading a 5.5MB engine (epic #124, issue #130). Every PGN import
# creates positions with no eval, and the only thing standing between that and a
# working bar used to be somebody remembering a command.
#
# Runs the engine on the runner rather than calling a Vercel endpoint (the shape
# fide-import.yml uses): the engine binary lives in this repo, so a checkout is
# the whole setup — no download to be blocked, and no question about whether
# static/ files are readable from a serverless function.

on:
  schedule:
    - cron: '0 4 * * *' # 04:00 UTC daily
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max positions to evaluate in this run'
        required: false
        default: '5000'
      workers:
        description: 'Engines to run in parallel'
        required: false
        default: '4'

# Two runs at once duplicate searches — nothing claims rows — so a slow run
# delays the next one rather than racing it.
concurrency:
  group: eval-positions
  cancel-in-progress: false

jobs:
  evaluate:
    name: Evaluate pending positions
    runs-on: ubuntu-latest
    # A full sweep of ~31k positions took ~11 minutes at 8 engines locally; the
    # per-run cap below keeps a scheduled run far inside this.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mychess
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mychess/package-lock.json

      - run: npm ci

      # Capped per run: the job is resumable and runs daily, so a large backlog
      # drains over a few days instead of one run sitting on a runner for hours.
      # Uncapped catch-up is a workflow_dispatch away.
      - name: Evaluate pending positions
        run: npm run positions:eval -- "${{ inputs.limit || '5000' }}" --workers="${{ inputs.workers || '4' }}"
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
