name: Apply Supabase Migrations

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would be applied without applying it'
        type: boolean
        required: false
        # Defaults ON deliberately (GitHub issue #156). Every migration in this
        # repo's history was applied by hand through the SQL editor, which does
        # not write to `supabase_migrations.schema_migrations` — so a push
        # against a stale history table replays already-applied migrations,
        # some of them destructive. Whoever runs this should have to opt IN to
        # writing, having first read a dry run.
        default: true

jobs:
  migrate:
    name: Push SQL migrations to Supabase
    runs-on: ubuntu-latest
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Get database URL from Vercel
        id: db-url
        run: |
          # Try SUPABASE_DB_URL secret first (fastest path)
          if [ -n "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "Using SUPABASE_DB_URL secret"
            DB_URL="${{ secrets.SUPABASE_DB_URL }}"
            echo "::add-mask::$DB_URL"
            echo "db_url=$DB_URL" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Fallback: fetch from Vercel project env vars
          echo "SUPABASE_DB_URL not set — fetching from Vercel..."
          ENV_LIST=$(curl -s "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env" \
            -H "Authorization: Bearer $VERCEL_TOKEN")

          for KEY in POSTGRES_URL_NON_POOLING POSTGRES_URL DATABASE_URL; do
            ENV_ID=$(echo "$ENV_LIST" | jq -r ".envs[] | select(.key == \"$KEY\") | .id" | head -1)
            if [ -n "$ENV_ID" ] && [ "$ENV_ID" != "null" ]; then
              DB_URL=$(curl -s "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env/$ENV_ID" \
                -H "Authorization: Bearer $VERCEL_TOKEN" | jq -r '.value // empty')
              if [ -n "$DB_URL" ]; then
                echo "::add-mask::$DB_URL"
                echo "db_url=$DB_URL" >> $GITHUB_OUTPUT
                exit 0
              fi
            fi
          done

          echo "❌ Could not find a Postgres URL."
          echo "Add SUPABASE_DB_URL to GitHub secrets (Settings → Secrets → Actions)."
          exit 1

      - name: Show recorded migration history
        # Printed before anything is applied so a run's log always shows what
        # the database believed had already been applied. A history table that
        # stops short of the newest file is the signal that migrations were
        # applied by hand and the history needs repairing first — see #156.
        run: |
          npx supabase migration list --db-url "${{ steps.db-url.outputs.db_url }}" || \
            echo "⚠ Could not list migration history — continuing so the step below reports too."
        working-directory: mychess

      - name: Refuse to push a replay-unsafe migration
        # GitHub issue #198. Four migrations must never be replayed — they carry
        # a `@replay-unsafe:` marker naming the reason (see #195's audit). The
        # worst is `0006_badges.sql`, whose `truncate public.badges cascade`
        # reaches `badges_earned` through its foreign key and would delete every
        # player's earned-badge history.
        #
        # A comment cannot stop `db push`, and the hazard is one unticked
        # checkbox away: this project's history table does not record the
        # hand-applied migrations, so against it push offers to replay from
        # 0001. So the pending set is checked against the markers, and a real
        # push is refused rather than left to a reviewer noticing.
        #
        # Parses filenames out of the dry-run output rather than assuming its
        # phrasing, so a CLI wording change degrades to "nothing matched"
        # instead of a false pass on a specific header line.
        run: |
          set +e
          dry_output=$(npx supabase db push --dry-run --db-url "${{ steps.db-url.outputs.db_url }}" 2>&1)
          dry_status=$?
          set -e
          printf '%s\n' "$dry_output"

          # A failed dry run yields no filenames, which must NOT be read as
          # "nothing pending" — that is a guard that waves through exactly the
          # case it cannot see. Observed for real on run 34216193073: the dry
          # run aborted with "Remote migration versions not found in local
          # migrations directory" (remote records 0074, which 389fae7
          # renumbered away locally), and an earlier version of this step
          # reported "Nothing pending" and passed.
          if [ "$dry_status" -ne 0 ]; then
            echo ""
            echo "The pending set is UNKNOWN — \`db push --dry-run\` exited $dry_status."
            echo "Not treating that as 'nothing pending'. Fix the dry run first;"
            echo "a history mismatch is usually repaired with"
            echo "  supabase migration repair --status reverted <version>"
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "::warning::Dry run — pending set unknown, so a real push would be refused."
              exit 0
            fi
            echo "::error::Refusing to push: could not determine which migrations would be applied."
            exit 1
          fi

          pending=$(printf '%s\n' "$dry_output" | grep -oE '[0-9]{4}_[A-Za-z0-9_-]+\.sql' | sort -u || true)
          if [ -z "$pending" ]; then
            echo "Dry run succeeded and reported no pending migrations — nothing to check."
            exit 0
          fi

          unsafe=""
          for file in $pending; do
            path="supabase/migrations/$file"
            [ -f "$path" ] || continue
            if grep -q '@replay-unsafe' "$path"; then
              unsafe="$unsafe $file"
            fi
          done

          if [ -z "$unsafe" ]; then
            echo "No pending migration is marked @replay-unsafe."
            exit 0
          fi

          echo ""
          echo "Pending set includes migrations marked @replay-unsafe:"
          for file in $unsafe; do
            echo "  $file"
            awk '/@replay-unsafe/{found=1} found && /^--/{print "    " $0; shown++; if (shown>=6) exit; next} found{exit}' "supabase/migrations/$file"
          done
          echo ""
          echo "Apply these by hand in the Supabase SQL editor instead, substituting"
          echo "any placeholders first. See GitHub issues #195 and #198."

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "::warning::Dry run, so not failing — but a real push would be refused."
            exit 0
          fi
          echo "::error::Refusing to push: the pending set includes replay-unsafe migrations."
          exit 1
        working-directory: mychess

      - name: Push all migrations
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "DRY RUN — reporting only, nothing will be applied."
            npx supabase db push --dry-run --db-url "${{ steps.db-url.outputs.db_url }}"
            echo ""
            echo "Nothing was applied. Re-run with dry_run unchecked to apply."
          else
            echo "APPLYING migrations."
            npx supabase db push --db-url "${{ steps.db-url.outputs.db_url }}"
          fi
        working-directory: mychess
