name: FIDE monthly import

on:
  schedule:
    - cron: '0 3 1 * *' # 03:00 UTC on the 1st of each month
  workflow_dispatch: {}

jobs:
  import:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mychess
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22+ ships a native global WebSocket; @supabase/supabase-js's
          # createClient constructs a Realtime client eagerly and throws on
          # Node < 22 without the "ws" package.
          node-version: '22'
      - run: npm ci
      - run: npm run fide:import
        env:
          # The job holds the ~47 MB zip and ~200 MB decompressed XML in memory;
          # raise the heap ceiling defensively (runner has ~7 GB).
          NODE_OPTIONS: '--max-old-space-size=4096'
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
