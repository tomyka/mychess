name: quality

# The one workflow for every push to main and every pull request (#261): it
# runs `node quality/gate.mjs check` (format, lint, strict typecheck,
# markers, every vitest project with coverage incl. the db suite, CRAP, dead
# code, architecture) and `pnpm build`. Mutation testing does not run in CI (#295, owner
# 2026-10-23); `node quality/gate.mjs mutation` runs it locally.
#
# Run-time notes:
# - The check job needs Docker: the db vitest project starts its test
#   Postgres with Testcontainers; ubuntu-latest has it. Node is .nvmrc's.
# - A newer push to the same ref cancels the running check: it only tests
#   stale code.
# - gate.mjs runs one gate at a time per working tree (quality/lock.mjs, the
#   pid in node_modules/.cache/ts-quality/gate.lock): a second run waits up
#   to QUALITY_GATE_LOCK_WAIT_MIN minutes (default 30), and a lock whose pid
#   is gone is taken over. Two runs at once would share coverage/.
# - The deadcode gate runs knip with KNIP_DISABLE_RAW_TRANSFER=1: oxc's raw
#   transfer takes a 6 GiB buffer, which Windows commits up front and refuses
#   when memory is busy; the findings are the same without it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: quality-check-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Security checklist item 10 (#233): no secret in any commit. The full
      # history is checked out above (fetch-depth 0).
      - name: Secret scan
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" zricethezav/gitleaks:v8.28.0 git /repo --no-banner --redact
      - name: The kit's own tests
        run: node --test "quality/*.test.mjs"
      - name: Static + test gates
        run: node quality/gate.mjs check
      - name: Build
        run: pnpm build
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quality-reports
          path: |
            coverage/
            reports/
          if-no-files-found: ignore

  # Playwright against a production build (apps/web test:e2e: next build,
  # next start on port 3100), desktop Chromium and a Pixel 7 profile, both on
  # Chromium. Only after a green check; a newer push to the same ref cancels
  # it, as it does the check. It has infra/compose.yaml's two services as
  # service containers on the same ports: Postgres 18.6, migrated before the
  # run, and Mailpit, which receives the magic-link mail the tests read
  # (docs/operations.md). The app runs as MYCHESS_ENV=local without Google;
  # its BETTER_AUTH_SECRET is a fixed CI-only value, not a secret: it signs
  # only this job's throwaway sessions.
  e2e:
    needs: check
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: quality-e2e-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: mychess
          POSTGRES_PASSWORD: mychess
          POSTGRES_DB: mychess
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mychess -d mychess"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ['1025:1025', '8025:8025']
    env:
      DATABASE_URL: postgres://mychess:mychess@127.0.0.1:5432/mychess
      MYCHESS_ENV: local
      BETTER_AUTH_SECRET: e2e-ci-value-e2e-ci-value-e2e-ci-value-00
      BETTER_AUTH_URL: http://127.0.0.1:3100
      MAIL_TRANSPORT: mailpit
      MAIL_FROM: mychess <noreply@mychess.test>
      MAILPIT_URL: http://127.0.0.1:8025
      LICHESS_CLIENT_ID: mychess-ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm --filter @mychess/web exec playwright install --with-deps --only-shell chromium
      - name: Migrate the E2E database
        run: pnpm --filter @mychess/db build && pnpm --filter @mychess/db migrate
      - name: E2E
        run: pnpm --filter @mychess/web test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore

  # TODO(#234): deploy to staging once its infrastructure exists. Shape, as
  # sportbet_new's ci.yml: needs [check], runs only for a green push to main
  # (and a workflow_dispatch redeploy of an earlier SHA), in the `staging`
  # environment with concurrency group deploy-staging; migrates the staging
  # database (pnpm --filter @mychess/db build, then node
  # packages/db/dist/migrate.mjs with DATABASE_URL from a secret), deploys
  # the web app, then smoke-tests the deployed URL.
