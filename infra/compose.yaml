# Local services for `next dev` and the E2E suite (docs/operations.md).
# Ports match CI's e2e service containers; bound to localhost only.
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: mychess
      POSTGRES_PASSWORD: mychess
      POSTGRES_DB: mychess
    ports: ['127.0.0.1:5432:5432']
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
